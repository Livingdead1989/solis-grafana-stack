
# =================================
# InfluxDB v2 output
# =================================
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "home"
  bucket = "solis"

# =================================
# Exec input: login + latest data
# =================================
[[inputs.exec]]
  commands = ["/etc/telegraf/scripts/solis_latest.sh"]
  timeout = "20s"
  data_format = "json_v2"
  interval = "${SOLIS_POLL_INTERVAL}s"

  [[inputs.exec.json_v2]]
    measurement_name = "solis_inverter"

    # ---- Map fields (edit paths to match your API payload) ----
    [[inputs.exec.json_v2.field]]
      path = "data.activePower"
      rename = "active_power"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.gridVoltage"
      rename = "grid_voltage"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.gridFrequency"
      rename = "grid_frequency"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.pv1Voltage"
      rename = "pv1_voltage"
      type = "float"
    [[inputs.exec.json_v2.field]]
      path = "data.pv1Current"
      rename = "pv1_current"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.pv2Voltage"
      rename = "pv2_voltage"
      type = "float"
    [[inputs.exec.json_v2.field]]
      path = "data.pv2Current"
      rename = "pv2_current"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.inverterTemp"
      rename = "inverter_temperature"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.energyToday"
      rename = "energy_today"
      type = "float"

    [[inputs.exec.json_v2.field]]
      path = "data.energyTotal"
      rename = "energy_total"
      type = "float"

    # Tags
    [[inputs.exec.json_v2.tag]]
      path = "data.deviceSn"
      rename = "device_sn"
    [[inputs.exec.json_v2.tag]]
      path = "data.model"
      rename = "model"

# Optional: drop script error payloads
[[processors.starlark]]
  source = '''
def apply(metric):
  if metric.fields.get("error") == "auth_failed":
    return None
  return metric
'''
